{% extends "base.html" %}

{% block title %}Add User{% endblock %}

{% block content %}
<h2>Add User</h2>

<form method="POST">
    <label>Username:</label>
    <input type="text" name="username" value="{{ values.username|default('', true) }}" required>

    <label>Email:</label>
    <input type="email" name="email" value="{{ values.email|default('', true) }}" required>

    <label>Password:</label>
    <input type="password" name="password" required>

    <label>Role:</label>
    <select name="role" required>
        {% for role in roles %}
        <option value="{{ role }}" {% if values.role|default('employee', true) == role %}selected{% endif %}>{{ role|capitalize }}</option>
        {% endfor %}
    </select>

    <button type="submit">Save User</button>
</form>

<br>
<a href="{{ url_for('users.users') }}">Back to Users</a>
{% endblock %}
