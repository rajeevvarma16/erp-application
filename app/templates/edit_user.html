{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}
<h2>Edit User</h2>

<form method="POST">
    <label>Username:</label>
    <input type="text" name="username" value="{{ values.username if values else user.username }}" required>

    <label>Email:</label>
    <input type="email" name="email" value="{{ values.email if values else user.email }}" required>

    <label>New password:</label>
    <input type="password" name="password">
    <small>Leave blank to keep the current password.</small>

    <label>Role:</label>
    <select name="role" required>
        {% set selected_role = values.role if values else user.role %}
        {% for role in roles %}
        <option value="{{ role }}" {% if selected_role == role %}selected{% endif %}>{{ role|capitalize }}</option>
        {% endfor %}
    </select>

    <button type="submit">Update User</button>
</form>

<br>
<a href="{{ url_for('users.users') }}">Back to Users</a>
{% endblock %}
